version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@9.15.5
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @tsurugaoka/web build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
