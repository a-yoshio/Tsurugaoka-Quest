version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@9.15.5
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          baseDirectory: apps/web
          commands:
            - pnpm --filter web build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
