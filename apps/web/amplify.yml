version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@9.15.5
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - test -n "$ASSETS_S3_BUCKET"
            - test -n "$ASSETS_S3_BASE_URL"
            - VITE_ASSETS_S3_BASE_URL="$ASSETS_S3_BASE_URL" pnpm --filter @tsurugaoka/web build
            - aws s3 sync dist/assets "s3://$ASSETS_S3_BUCKET/assets/image/assets" --only-show-errors
            - aws s3 cp dist "s3://$ASSETS_S3_BUCKET/assets/image" --recursive --exclude "*" --include "*.png" --only-show-errors
        postBuild:
          commands:
            - test -f dist/index.html
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - index.html
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
