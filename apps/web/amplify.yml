version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@9.15.5
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter web build
        postBuild:
          commands:
            - test -f dist/index.html
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - index.html
      cache:
        paths:
          - node_modules/**/*
