version: 1
backend:
  phases:
    preBuild:
      commands:
        - cd ../.. && npm install --global pnpm@9.15.5
        - cd ../.. && pnpm install --frozen-lockfile
    build:
      commands:
        - cd ../.. && pnpm --filter @tsurugaoka/backend exec ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir apps/web
frontend:
  phases:
    preBuild:
      commands:
        - npm install --global pnpm@9.15.5
        - cd ../.. && pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter @tsurugaoka/web build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - ../../node_modules/**/*
      - ../../.pnpm-store/**/*
